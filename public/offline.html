<!doctype html>
<html lang="el">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Χωρίς σύνδεση · Taxi Fleet Tracker</title>
    <!-- Η σελίδα που δείχνει ο service worker (sw.js) όταν η εφαρμογή ανοίγει χωρίς σήμα. Αυτοτελής: χωρίς εξωτερικά αρχεία. -->
    <style>
      :root {
        --bg: #f3f4f6;
        --card: #ffffff;
        --fg: #111827;
        --muted: #565e6b;
        --line: #e5e7eb;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0f19;
          --card: #151b2b;
          --fg: #e5e7eb;
          --muted: #a8afbb;
          --line: #263041;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font: 18px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif;
      }
      main {
        width: 100%;
        max-width: 28rem;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 24px 20px;
        text-align: center;
      }
      svg {
        width: 64px;
        height: 64px;
      }
      h1 {
        margin: 12px 0 4px;
        font-size: 24px;
      }
      p {
        margin: 8px 0 0;
        color: var(--muted);
      }
      button {
        margin-top: 20px;
        min-height: 48px;
        padding: 0 24px;
        border: 0;
        border-radius: 12px;
        background: #facc15;
        color: #1f2937;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="#facc15" />
        <g transform="translate(0 3.25)">
          <rect x="25" y="11" width="14" height="7" rx="2" fill="#111827" />
          <path
            d="M12 44V35l5-11a6 6 0 0 1 5.5-3.6h19A6 6 0 0 1 47 24l5 11v9a2.5 2.5 0 0 1-2.5 2.5h-3A2.5 2.5 0 0 1 44 44v-1.5H20V44a2.5 2.5 0 0 1-2.5 2.5h-3A2.5 2.5 0 0 1 12 44z"
            fill="#111827"
          />
          <path d="M19.5 33l3-7.4a2.5 2.5 0 0 1 2.3-1.6h14.4a2.5 2.5 0 0 1 2.3 1.6l3 7.4z" fill="#fef08a" />
          <circle cx="20" cy="38" r="3" fill="#fef9c3" />
          <circle cx="44" cy="38" r="3" fill="#fef9c3" />
        </g>
      </svg>
      <h1>Χωρίς σύνδεση</h1>
      <p>Η εφαρμογή χρειάζεται internet για να ανοίξει. Μόλις έρθει σήμα, ανοίγει μόνη της.</p>
      <p>
        Όσες βάρδιες γράψατε όταν χάθηκε το σήμα έχουν μείνει στο κινητό και στέλνονται μόλις ανοίξει ξανά η
        εφαρμογή.
      </p>
      <button type="button" onclick="location.reload()">Δοκιμή ξανά</button>
    </main>
    <script>
      window.addEventListener('online', () => location.reload());
    </script>
  </body>
</html>
